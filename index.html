<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Capsale - Flex Layout</title>
    <link rel="stylesheet" href=".//style.css">
</head>
<body>

    <div class="site-canvas">
        <header class="header">
            <div class="logo-box">
                <span class="logo-text">capsale</span>
                <div class="logo-sep"></div>
                <img src="hanger.png" class="hanger-img" alt="logo">
            </div>

            <nav class="nav">
                <a href="#" class="nav-link">Каталог</a>
                <a href="#" class="nav-link">Возможности</a>
                <a href="#" class="nav-link">Вопрос-ответ</a>
                <a href="#" class="nav-link">Галерея</a>
                <a href="#" class="nav-link">Контакты</a>
            </nav>

            <div class="social">
                <img src="whatsapp.png" alt="wa" class="wa-icon">
            </div>
        </header>

        <main class="hero">
            <div class="hero-content">
                <h1>Капсульная одежда <br> <span class="red">ОПТОМ</span> для маркетплейсов и шоу-румов</h1>
                <p>Зарабатывайте <span class="red-bold">более 300%</span> на наценке с продажи одежды Capsale в своем шоу-руме или маркетплейсе</p>
                <button class="btn">Получить полный каталог</button>
            </div>

            <div class="hero-visual">
                <div class="shape-beige">
                    <img src="2.png" alt="Model" class="img-main">
                    <div class="price-tag">
                        <span class="dot"></span> Цена опт: от 400 р.
                    </div>
                </div>
                <div class="shape-pink">
                    <img src="1.png" alt="Side" class="img-side">
                </div>
            </div>
        </main>
    </div>

</body>
</html>
